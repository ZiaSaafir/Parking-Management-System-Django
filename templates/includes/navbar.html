<header class="top-navbar">

    <div>
        <h1 class="page-title">
            Smart Parking Management System
        </h1>

        <p class="page-subtitle">
            Professional parking operations dashboard
        </p>
    </div>

    <div class="user-box">

        {% if user.is_authenticated %}

            <span class="user-name">
                {{ user.username }}
            </span>

                {{ user.userprofile.role }}
            </span>

        {% endif %}

    </div>

</header>
