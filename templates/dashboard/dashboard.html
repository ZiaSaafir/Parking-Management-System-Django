{% extends 'layouts/base.html' %}

{% block content %}

<div class="dashboard-header">

    <h2>
        Dashboard Overview
    </h2>

</div>

<div class="stats-grid">

    <div class="stat-card">

        <h3>Total Slots</h3>

        <p>{{ total_slots }}</p>

    </div>

    <div class="stat-card">

        <h3>Occupied Slots</h3>

        <p>{{ occupied_slots }}</p>

    </div>

    <div class="stat-card">

        <h3>Available Slots</h3>
<p>{{ available_slots }}</p>

    </div>

    <div class="stat-card">

        <h3>Today's Revenue</h3>

        <p>Rs. {{ total_revenue }}</p>

    </div>

    <div class="stat-card">

    <h3>Active Tickets</h3>

    <p>{{ active_tickets }}</p>

</div>
</div>

{% endblock %}
